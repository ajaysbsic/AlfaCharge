name: Architecture Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  guardrails:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Alfacharge.sln

      - name: Build
        run: dotnet build .\Alfacharge.sln -c Release --no-restore

      - name: Run Architecture Guardrails
        shell: pwsh
        run: .\eng\architecture-guardrails.ps1 -Root .
